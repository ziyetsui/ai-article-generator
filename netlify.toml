# Netlify Deployment Configuration

# Base build settings for the production environment
[build]
  # Command to build the frontend application
  command = "cd frontend && npm install && npm run build"
  
  # Directory where the built frontend files are located
  publish = "frontend/build"
  
  # Directory where the serverless functions are located
  functions = "api"

# Redirects and rewrites rules are processed in the order they appear.

# Rule to proxy API requests to our serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/index-background"
  status = 200 # This makes it a rewrite (proxy)

# Rule for Single Page Application (SPA) routing
# This should be the last rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
